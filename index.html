<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02070b"><title>Master Manager v1.3</title><style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;min-height:100%;background:#01070b;color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}.screen{min-height:100vh;background:#01070b}.art{position:relative;width:min(100vw,1536px);aspect-ratio:3/2;margin:auto;background-position:center;background-size:contain;background-repeat:no-repeat}.startArt{background-image:url("assets/ui_start.webp")}.selectionArt{background-image:url("assets/ui_start.webp")}.manageArt{background-size:contain}.overlay{position:absolute;inset:0}.hot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0}.hot:hover{outline:1px solid rgba(19,230,237,.18);box-shadow:inset 0 0 30px rgba(19,230,237,.05)}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(15px);opacity:0;transition:.2s;background:rgba(3,15,22,.96);border:1px solid #12dce4;border-radius:6px;padding:11px 16px;font-size:12px;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,5,9,.72);backdrop-filter:blur(5px);z-index:50;padding:20px}.panel{width:min(820px,94vw);max-height:88vh;overflow:auto;background:rgba(4,16,24,.97);border:1px solid #19dbe3;border-radius:14px;box-shadow:0 0 45px rgba(0,230,240,.16);padding:24px}.panel h1{margin:0 0 8px;color:#f5fbfd;font-size:25px}.panel h2{color:#12e0e6;font-size:14px;letter-spacing:.12em;margin:0 0 15px}.panel p{color:#a9bcc4;font-size:13px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.choice{background:rgba(6,27,38,.88);border:1px solid rgba(48,145,165,.55);color:#fff;border-radius:10px;padding:15px;text-align:left;cursor:pointer}.choice:hover,.choice.active{border-color:#16e4eb;box-shadow:0 0 18px rgba(19,230,237,.12)}.choice b{display:block;font-size:15px;margin-bottom:5px}.choice small{color:#94aeb7;font-size:11px;line-height:1.45}.panel .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.btn{border:1px solid #17dfe6;background:#07323c;color:#fff;border-radius:7px;padding:11px 16px;cursor:pointer}.btn.secondary{border-color:#38535d;background:#08141a}.match{min-height:100vh;background:#040b11;padding:18px}.matchRoot{width:min(1200px,100%);margin:auto}.matchHeader{display:flex;align-items:center;gap:16px;background:#071620;border:1px solid rgba(120,210,230,.15);padding:14px 18px}.matchHeader h1{font-size:22px;margin:0}.cyan{color:#28e1e1}.scoreCard{margin-top:8px;background:#081821;border:1px solid rgba(120,210,230,.12);padding:28px;text-align:center}.scoreTeams{font-size:25px;font-weight:700}.clock{font-size:15px;color:#aabcc5;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:#071620;border:1px solid rgba(120,210,230,.12);padding:14px;text-align:center;font-size:13px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.event{margin-top:10px;background:#071620;border:1px solid rgba(120,210,230,.12);padding:14px;color:#9db0b8;font-size:12px;text-align:center}.matchButton{margin-top:14px;width:100%;padding:14px;border:1px solid #19dbe3;background:#07323c;color:#fff;border-radius:7px;font-weight:700}.half{position:fixed;inset:0;background:rgba(1,7,11,.9);display:grid;place-items:center;z-index:60}.half .panel{text-align:center}.hidden{display:none!important}.loading{padding:30px;text-align:center;color:#9fb0b8}
@media(max-width:800px){.art{width:100vw;min-height:calc(100vh - 20px);background-size:contain}.panel{padding:16px}.choices{grid-template-columns:1fr}.scoreTeams{font-size:17px}.stats,.actions{grid-template-columns:1fr}.match{padding:10px}}
</style></head><body><div id="app"></div><div id="toast"></div><script>
window.MM_AUDIO_UNLOCKED=false;
window.addEventListener('pointerdown',function(){window.MM_AUDIO_UNLOCKED=true;},{once:true});
</script><script>window.MM_CLUBS={"season":"2026/27","clubs":[{"club":"Athletic Club","stadium":"San Mamés","capacity":53331,"division":1},{"club":"Atlético de Madrid","stadium":"Riyadh Air Metropolitano","capacity":70460,"division":1},{"club":"CA Osasuna","stadium":"El Sadar","capacity":23576,"division":1},{"club":"Celta","stadium":"Abanca Balaídos","capacity":29000,"division":1},{"club":"Deportivo Alavés","stadium":"Mendizorroza","capacity":19840,"division":1},{"club":"Elche CF","stadium":"Martínez Valero","capacity":33732,"division":1},{"club":"FC Barcelona","stadium":"Spotify Camp Nou","capacity":99354,"division":1},{"club":"Getafe CF","stadium":"Coliseum","capacity":16800,"division":1},{"club":"Levante UD","stadium":"Ciutat de València","capacity":26354,"division":1},{"club":"Málaga CF","stadium":"La Rosaleda","capacity":30044,"division":1},{"club":"R. Racing Club","stadium":"Campos de Sport de El Sardinero","capacity":12500,"division":1},{"club":"Rayo Vallecano","stadium":"Estadio de Vallecas","capacity":14708,"division":1},{"club":"RC Deportivo","stadium":"ABANCA-RIAZOR","capacity":32660,"division":1},{"club":"RCD Espanyol de Barcelona","stadium":"RCDE Stadium","capacity":40500,"division":1},{"club":"Real Betis","stadium":"Estadio Benito Villamarín","capacity":60721,"division":1},{"club":"Real Madrid","stadium":"Santiago Bernabéu","capacity":83168,"division":1},{"club":"Real Sociedad","stadium":"Reale Arena","capacity":39500,"division":1},{"club":"Sevilla FC","stadium":"Ramón Sánchez-Pizjuán","capacity":43883,"division":1},{"club":"Valencia CF","stadium":"Mestalla","capacity":49430,"division":1},{"club":"Villarreal CF","stadium":"Estadio de la Cerámica","capacity":23500,"division":1},{"club":"CE Sabadell","stadium":"Nova Creu Alta","capacity":11700,"division":2},{"club":"Real Sporting","stadium":"El Molinón","capacity":28800,"division":2},{"club":"R. Sociedad B","stadium":"Zubieta","capacity":39500,"division":2},{"club":"Cádiz CF","stadium":"Nuevo Mirandilla","capacity":20724,"division":2},{"club":"RCD Mallorca","stadium":"Son Moix","capacity":26020,"division":2},{"club":"CD Eldense","stadium":"Nuevo Pepico Amat","capacity":4030,"division":2},{"club":"CD Castellón","stadium":"SkyFi Castalia","capacity":16000,"division":2},{"club":"CD Tenerife","stadium":"Heliodoro Rodríguez López","capacity":22667,"division":2},{"club":"Celta Fortuna","stadium":"Balaídos","capacity":29000,"division":2},{"club":"Real Oviedo","stadium":"Carlos Tartiere","capacity":30500,"division":2},{"club":"Real Valladolid CF","stadium":"José Zorrilla","capacity":27618,"division":2},{"club":"CD Leganés","stadium":"Butarque","capacity":12450,"division":2},{"club":"Girona FC","stadium":"Montilivi","capacity":14500,"division":2},{"club":"Granada CF","stadium":"Nuevo Los Cármenes","capacity":19336,"division":2},{"club":"SD Eibar","stadium":"Ipurua","capacity":8164,"division":2},{"club":"Albacete BP","stadium":"Carlos Belmonte","capacity":17524,"division":2},{"club":"FC Andorra","stadium":"Nou Estadi Encamp","capacity":3306,"division":2},{"club":"UD Las Palmas","stadium":"Gran Canaria","capacity":32392,"division":2},{"club":"Córdoba CF","stadium":"El Arcángel","capacity":25000,"division":2},{"club":"AD Ceuta FC","stadium":"Alfonso Murube","capacity":6007,"division":2},{"club":"Burgos CF","stadium":"El Plantío","capacity":12200,"division":2},{"club":"UD Almería","stadium":"Power Horse Stadium","capacity":18331,"division":2}]};function asset(name){return (window.MM_MEDIA&&window.MM_MEDIA[name])||('assets/'+name)}

const S={screen:'start',division:1,team:null,preseasonCount:2,preseasonRivals:[],control:'MEDIO',section:'Competiciones',sub:'RESUMEN',match:null};
let clubs=[];let audio={};let timers=[];
const app=document.getElementById('app');const toastEl=document.getElementById('toast');
const $=s=>document.querySelector(s);
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),1800)}
function click(){window.MM_AUDIO_UNLOCKED=true;const a=new Audio(asset('click.wav'));a.volume=.5;a.play().catch(()=>{})}
function music(kind){Object.values(audio).forEach(a=>{try{a.pause()}catch{}});audio={};const f={start:'music_inicio_loop.mp3',gestion:'music_gestion_loop.mp3',match:'match_crowd_loop.mp3'}[kind];if(!f)return;const a=new Audio(asset(f));a.loop=true;a.volume=kind==='match'?.28:.7;a.play().catch(()=>{});audio[kind]=a}
function loadClubs(){clubs=window.MM_CLUBS.clubs||window.MM_CLUBS;return Promise.resolve()}
function save(){localStorage.setItem('mm_v13_web_faithful',JSON.stringify(S));toast('Partida guardada')}
function load(){try{Object.assign(S,JSON.parse(localStorage.getItem('mm_v13_web_faithful')));toast('Partida cargada')}catch{toast('No hay partida guardada')}}
function modal(inner){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="panel">${inner}</div>`;document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d)d.remove()});return d}
function start(){if(window.MM_AUDIO_UNLOCKED)music('start');app.innerHTML=`<div class="art startArt"><div class="overlay"><button class="hot" style="left:28%;top:47%;width:22%;height:30%" aria-label="Nueva partida" onclick="newGame()"></button><button class="hot" style="left:50%;top:47%;width:23%;height:30%" aria-label="Cargar partida" onclick="loadGame()"></button><button class="hot" style="right:0;top:0;width:13%;height:14%" onclick="toast('Opciones')"></button><button class="hot" style="left:25%;bottom:0;width:50%;height:16%" onclick="toast('Master Manager v1.3')"></button></div></div>`}
function newGame(){click();S.screen='division';selection('NUEVA PARTIDA','Elige la división desde la que comenzarás tu carrera.',[['PRIMERA DIVISIÓN','20 clubes · 2026/27'],['SEGUNDA DIVISIÓN','22 clubes · 2026/27']],i=>{S.division=i+1;S.screen='team';teamSelection()})}
function loadGame(){click();if(localStorage.getItem('mm_v13_web_faithful')){load();S.screen='management';renderManagement()}else toast('No hay partida guardada')}
function selection(title,sub,opts,onPick){const d=modal(`<div class="selectionWrap"><h1>${title}</h1><p>${sub}</p><div class="choices">${opts.map((o,i)=>`<button class="choice" data-i="${i}"><b>${o[0]}</b><small>${o[1]||''}</small></button>`).join('')}</div><div class="row"><button class="btn secondary" id="close">ATRÁS</button></div></div>`);d.querySelector('#close').onclick=()=>d.remove();d.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{click();d.remove();onPick(+b.dataset.i)})}
function teamSelection(){const arr=clubs.filter(c=>c.division===S.division).sort((a,b)=>a.club.localeCompare(b.club));const d=modal(`<h1>ELIGE TU NUEVO DESAFÍO</h1><p>Selecciona el club que quieres dirigir.</p><div class="choices">${arr.map((c,i)=>`<button class="choice" data-i="${i}"><b>${c.club}</b><small>${c.stadium} · ${c.capacity.toLocaleString('es-ES')} plazas</small></button>`).join('')}</div>`);d.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{click();S.team=arr[+b.dataset.i];d.remove();objectiveSelection()})}
function objectiveSelection(){const opts=S.division===2?['Ascender a Primera','Consolidarse en Segunda','Evitar el descenso']:['Consolidarse en media tabla','Evitar el descenso','Luchar por Europa'];const d=modal(`<h1>OBJETIVO REALISTA</h1><p>Define el objetivo inicial de la directiva.</p><div class="choices">${opts.map((o,i)=>`<button class="choice" data-i="${i}"><b>${o}</b></button>`).join('')}</div>`);d.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{click();d.remove();controlSelection()})}
function controlSelection(){const opts=[['CONTROL TOTAL','Tú decides fichajes, renovaciones, tácticas, entrenamiento y mantenimiento.'],['CONTROL MEDIO','El juego automatiza tareas rutinarias; tú decides mercado, plantilla y decisiones deportivas importantes.'],['CONTROL AUTOMÁTICO','La IA gestiona la rutina del club, mercado, plantilla, entrenamiento y tácticas.']];const d=modal(`<h1>NIVEL DE CONTROL</h1><div class="choices">${opts.map((o,i)=>`<button class="choice" data-i="${i}"><b>${o[0]}</b><small>${o[1]}</small></button>`).join('')}</div>`);d.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{click();S.control=['TOTAL','MEDIO','AUTO'][+b.dataset.i];d.remove();preseasonSelection()})}
function preseasonSelection(){const opts=Array.from({length:6},(_,i)=>[`${i} PARTIDOS`,i===0?'Comenzar directamente la liga':'Amistosos antes del inicio de liga']);const d=modal(`<h1>PRETEMPORADA</h1><p>Elige cuántos partidos amistosos quieres disputar antes de comenzar la liga.</p><div class="choices">${opts.map((o,i)=>`<button class="choice" data-i="${i}"><b>${o[0]}</b><small>${o[1]}</small></button>`).join('')}</div>`);d.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{click();S.preseasonCount=+b.dataset.i;d.remove();if(S.preseasonCount)rivalsSelection();else enterManagement()})}
function rivalsSelection(){const national=clubs.filter(c=>c.division===S.division&&c.club!==S.team.club);const intl=['Bayern Munich','Liverpool','Arsenal','Manchester City','Inter','AC Milan','Juventus','PSG','Ajax','Benfica'].map(n=>({club:n,stadium:'International Arena',division:0,capacity:30000}));const all=[...national,...intl];const d=modal(`<h1>ELIGE RIVALES DE PRETEMPORADA</h1><p>Selecciona hasta ${S.preseasonCount} rivales.</p><div class="choices">${all.map((c,i)=>`<button class="choice rival" data-i="${i}"><b>${c.division===0?'🌍':'🇪🇸'} ${c.club}</b><small>${c.stadium}</small></button>`).join('')}</div><div class="row"><button class="btn" id="confirm">CONFIRMAR RIVALES</button></div>`);let selected=[];d.querySelectorAll('.rival').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(selected.includes(i)){selected=selected.filter(x=>x!==i);b.classList.remove('active')}else if(selected.length<S.preseasonCount){selected.push(i);b.classList.add('active')}else toast('Máximo de rivales seleccionado')});d.querySelector('#confirm').onclick=()=>{click();while(selected.length<S.preseasonCount){const i=Math.floor(Math.random()*all.length);if(!selected.includes(i))selected.push(i)}S.preseasonRivals=selected.map(i=>all[i].club);d.remove();enterManagement()}}
function enterManagement(){S.screen='management';S.section='Competiciones';S.sub='RESUMEN';save();renderManagement();}
const artMap={Competiciones:'ui_competition.webp',Deportivo:'ui_team.webp',Gestión:'ui_club.webp',Estadio:'ui_stadium.webp'};
function renderManagement(){music('gestion');const bg=artMap[S.section]||artMap.Competiciones;app.innerHTML=`<div class="art manageArt" style="background-image:url('${asset(bg)}')"><div class="overlay">${navHotspots()}${subHotspots()}<button class="hot" style="left:43%;top:27%;width:20%;height:22%" onclick="startMatchFlow()" aria-label="Próximo partido"></button><button class="hot" style="left:86%;top:2%;width:13%;height:12%" onclick="toast('Opciones')"></button></div></div>`}
function navHotspots(){return `<button class="hot" style="left:0;top:14%;width:20%;height:11%" onclick="homeFromNav()"></button><button class="hot" style="left:0;top:25%;width:20%;height:12%" onclick="setSection('Competiciones')"></button><button class="hot" style="left:0;top:37%;width:20%;height:12%" onclick="setSection('Deportivo')"></button><button class="hot" style="left:0;top:49%;width:20%;height:12%" onclick="setSection('Gestión')"></button><button class="hot" style="left:0;top:61%;width:20%;height:12%" onclick="setSection('Estadio')"></button>`}
function subHotspots(){const sets={Competiciones:[['RESUMEN',22],['LALIGA',33],['COPA',44],['EUROPA',55],['CALENDARIO',66]],Deportivo:[['PLANTILLA',23],['TÁCTICAS',34],['ENTRENAMIENTO',45],['ANÁLISIS',56],['INFORMES',67]],Gestión:[['FINANZAS',22],['FICHAJES',33],['CONTRATOS',44],['STAFF',55],['PATROCINIOS',66],['OBJETIVOS',77]],Estadio:[['ESTADIO',22],['RESTAURACIÓN',33],['PARKING',44],['ABONOS',55],['MERCHANDISING',66],['INSTALACIONES',77]]};return (sets[S.section]||[]).map((x,i)=>`<button class="hot" style="left:${22+i*12}%;top:13%;width:11%;height:7%" onclick="openSub('${x[0]}')"></button>`).join('')}
function homeFromNav(){click();toast('Centro de jornada');openSub('CENTRO DE JORNADA')}
function setSection(s){click();S.section=s;S.sub='';renderManagement()}
function openSub(s){click();S.sub=s;const info={RESUMEN:'Resumen de competición, clasificación y próximo partido.',LALIGA:'Calendario y clasificación de liga.',COPA:'Copa del Rey y rondas pendientes.',EUROPA:'Competiciones europeas y participantes.',CALENDARIO:'Calendario inteligente y resultados.',PLANTILLA:'Plantilla, roles, forma y moral.',TÁCTICAS:'Táctica actual, instrucciones y alineaciones.',ENTRENAMIENTO:'Plan semanal y desarrollo.',ANÁLISIS:'Análisis de rendimiento del equipo.',INFORMES:'Informes deportivos.',FINANZAS:'Balance, ingresos, gastos y presupuestos.',FICHAJES:'Mercado, negociaciones y traspasos.',CONTRATOS:'Renovaciones y condiciones.',STAFF:'Cuerpo técnico y personal.',PATROCINIOS:'Patrocinadores e ingresos.',OBJETIVOS:'Objetivos de temporada.',ESTADIO:'Capacidad, estado y mejoras.',RESTAURACIÓN:'Gestión de restauración.',PARKING:'Gestión de parking.',ABONOS:'Abonos y asistencia.',MERCHANDISING:'Merchandising.',INSTALACIONES:'Instalaciones y mejoras.'}[s]||s;modal(`<h1>${s}</h1><p>${info}</p><div class="row"><button class="btn" onclick="this.closest('.modal').remove()">CERRAR</button>${s==='CALENDARIO'||s==='RESUMEN'?'<button class="btn" onclick="this.closest(\'.modal\').remove();startMatchFlow()">IR AL PARTIDO</button>':''}</div>`) }
function startMatchFlow(){click();S.screen='match';S.match={half:1,home:0,away:0,started:false,finished:false};renderMatch()}
function renderMatch(){music('match');app.innerHTML=`<div class="match"><div class="matchRoot"><div class="matchHeader"><h1>PARTIDO</h1><span class="cyan">  ${S.match.half===1?'PRIMERA PARTE':'SEGUNDA PARTE'}</span></div><div class="scoreCard"><div class="scoreTeams">${S.team?.club||'CD VICTORIA'} &nbsp;&nbsp; ${S.match.home} — ${S.match.away} &nbsp;&nbsp; R. OVIEDO</div><div class="clock" id="clock">18:30</div></div><div class="stats"><div class="stat">POSESIÓN<br><b>54%</b></div><div class="stat">TIROS<br><b>4 — 2</b></div><div class="stat">AMBIENTE<br><b>GRADA</b></div></div><div class="actions"><button class="btn" onclick="toast('Táctica disponible')">TÁCTICA</button><button class="btn" onclick="toast('Cambios disponibles')">CAMBIOS</button><button class="btn" onclick="toast('Instrucciones disponibles')">INSTRUCCIONES</button></div><div class="event" id="event">Información mínima durante el partido · gestión ampliada en el descanso</div><button class="matchButton" onclick="runHalf()">${S.match.finished?'VOLVER A GESTIÓN':S.match.started?'SIMULANDO...':'INICIAR PARTIDO'}</button></div></div>`}
function runHalf(){if(S.match.finished){S.screen='management';S.section='Competiciones';renderManagement();return}if(S.match.started)return;click();S.match.started=true;renderMatch();let left=3.5;const interval=setInterval(()=>{left-=.1;const c=document.getElementById('clock');if(c)c.textContent=(S.match.half===1?'1ª PARTE':'2ª PARTE')+' · '+Math.max(0,left).toFixed(1)+' s';if(left<=0){clearInterval(interval);S.match.started=false;if(S.match.half===1){S.match.half=2;renderMatch();showHalf()}else{S.match.finished=true;S.match.home=Math.random()<.55?1:2;S.match.away=S.match.home===2?0:1;renderMatch();save();}}},100)}
function showHalf(){const d=document.createElement('div');d.className='half';d.innerHTML='<div class="panel"><h1>DESCANSO</h1><p>Gestiona tu equipo antes de comenzar la segunda parte.</p><button class="btn" id="go2">COMENZAR 2ª PARTE</button></div>';document.body.appendChild(d);d.querySelector('#go2').onclick=()=>{d.remove();runHalf()}}
async function boot(){await loadClubs();start()}
boot();
</script></body></html>
